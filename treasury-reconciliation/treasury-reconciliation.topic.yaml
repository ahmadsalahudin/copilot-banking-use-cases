# REVISION 5 - streamed results, without mutable report accumulation.
# Full-data diagnostic: USER CONFIRMED PASS. Matching/loop runtime: not yet tested.
# Paste into a new blank Topic; turn off earlier reconciliation Topics for testing.
# The two data tables are identical to the passing full-data diagnostic.
# No With(), As aliases, ForAll(), custom numeric formats, or self-assignment.
# Each first assignment uses init:Topic; reads use Topic without init:.
# Foreach syntax follows Microsoft's voice-generative-answers YAML example.
# https://learn.microsoft.com/en-us/microsoft-copilot-studio/voice-generative-answers
# Amounts use integer cents; divide by 100 for display. Decimal padding is omitted.
# Scope: one USD account NOSTRO_USD_001, all supplied dates; movements, not balances.
# All internal references are unique in this fixture. Multiple bank candidates
# are unresolved review groups; this is not a split-settlement matching engine.
# Output: totals first, then 7 ledger messages, bank-only messages, review notes.
# Expected: USD 80000 internal, 144925 bank, 64925 difference; B008/B009 bank only.
kind: AdaptiveDialog
modelDescription: Runs the synthetic treasury reconciliation demo, showing calculated totals, each ledger comparison, and bank-only entries.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Treasury reconciliation V5
    triggerQueries:
      - run treasury reconciliation
      - reconcile treasury records
      - start reconciliation demo
  actions:
    # DATA: 7 internal records, preserved from the passing diagnostic.
    - kind: SetVariable
      id: loadInternalLedger
      variable: init:Topic.InternalLedger
      value: |-
        =Table(
          {RowId:"L001", Ref:"TRF1001", Cents:10000000, ValueDate:"2026-10-20"},
          {RowId:"L002", Ref:"TRF1002", Cents:-2500000, ValueDate:"2026-10-20"},
          {RowId:"L003", Ref:"TRF1003", Cents:5000000, ValueDate:"2026-10-20"},
          {RowId:"L004", Ref:"TRF1004", Cents:-1000000, ValueDate:"2026-10-20"},
          {RowId:"L005", Ref:"TRF1005", Cents:-4000000, ValueDate:"2026-10-20"},
          {RowId:"L006", Ref:"TRF1006", Cents:2000000, ValueDate:"2026-10-20"},
          {RowId:"L007", Ref:"TRF1007", Cents:-1500000, ValueDate:"2026-10-20"}
        )
    # DATA: 9 bank records, preserved from the passing diagnostic.
    - kind: SetVariable
      id: loadBankStatement
      variable: init:Topic.BankStatement
      value: |-
        =Table(
          {RowId:"B001", Ref:"TRF1001", Cents:10000000, ValueDate:"2026-10-20"},
          {RowId:"B002", Ref:"TRF1002", Cents:-2500000, ValueDate:"2026-10-20"},
          {RowId:"B003", Ref:"TRF1003", Cents:5000000, ValueDate:"2026-10-20"},
          {RowId:"B004", Ref:"TRF1004", Cents:-1002500, ValueDate:"2026-10-20"},
          {RowId:"B005", Ref:"TRF1005", Cents:-4000000, ValueDate:"2026-10-21"},
          {RowId:"B006", Ref:"TRF1006", Cents:2000000, ValueDate:"2026-10-20"},
          {RowId:"B007", Ref:"TRF1006", Cents:2000000, ValueDate:"2026-10-20"},
          {RowId:"B008", Ref:"FEE1020", Cents:-5000, ValueDate:"2026-10-20"},
          {RowId:"B009", Ref:"TRF1008", Cents:3000000, ValueDate:"2026-10-20"}
        )
    # TOTALS: reuse the passing CountRows/Sum/Text pattern; no custom money format.
    - kind: SetVariable
      id: computeSummaryV5
      variable: init:Topic.SummaryV5
      value: |-
        ="USD NOSTRO RECONCILIATION - SYNTHETIC DEMO" & Char(10) &
        "Account NOSTRO_USD_001; all supplied movements dated 20-21 October 2026." & Char(10) &
        "Internal rows: " & Text(CountRows(Topic.InternalLedger)) &
        "; Bank rows: " & Text(CountRows(Topic.BankStatement)) & Char(10) &
        "Internal USD: " & Text(Sum(Topic.InternalLedger, Cents) / 100) &
        "; Bank USD: " & Text(Sum(Topic.BankStatement, Cents) / 100) & Char(10) &
        "Bank minus internal USD: " & Text((Sum(Topic.BankStatement, Cents) - Sum(Topic.InternalLedger, Cents)) / 100)
    - kind: SendActivity
      id: sendSummaryV5
      activity: '{Topic.SummaryV5}'
    # LOOP: the current ledger row is a typed Topic record, not a formula alias.
    - kind: Foreach
      id: compareEachLedgerV5
      items: =Topic.InternalLedger
      value: init:Topic.LedgerRowV5
      index: init:Topic.LedgerIndexV5
      actions:
        # FILTER: one table scope. Ref is its column; the compared value is explicitly qualified.
        - kind: SetVariable
          id: findCandidatesV5
          variable: init:Topic.CandidatesV5
          value: =Filter(Topic.BankStatement, Ref = Topic.LedgerRowV5.Ref)
        # RULES: ambiguity/missing/multiple are checked before amount and date.
        - kind: SetVariable
          id: classifyV5
          variable: init:Topic.MatchStatusV5
          value: |-
            =If(
              CountRows(Filter(Topic.InternalLedger, Ref = Topic.LedgerRowV5.Ref)) > 1,
              "AMBIGUOUS INTERNAL REFERENCE",
              CountRows(Topic.CandidatesV5) = 0,
              "INTERNAL ONLY",
              CountRows(Topic.CandidatesV5) > 1,
              "SUSPECTED DUPLICATE / MULTIPLE BANK ENTRIES",
              First(Topic.CandidatesV5).Cents <> Topic.LedgerRowV5.Cents,
              "AMOUNT MISMATCH",
              First(Topic.CandidatesV5).ValueDate <> Topic.LedgerRowV5.ValueDate,
              "VALUE-DATE DIFFERENCE",
              "EXACT MATCH"
            )
        # DETAILS: display all candidates, never choose a duplicate arbitrarily.
        - kind: SetVariable
          id: formatCandidateDetailsV5
          variable: init:Topic.BankDetailsV5
          value: |-
            =If(
              CountRows(Topic.CandidatesV5) = 0,
              "No bank entry",
              Concat(Topic.CandidatesV5, RowId & " | USD " & Text(Cents / 100) & " | " & ValueDate, "; ")
            )
        - kind: SetVariable
          id: formatLedgerAmountV5
          variable: init:Topic.LedgerAmountV5
          value: =Text(Topic.LedgerRowV5.Cents / 100)
        # DISPLAY: send each result directly; never append to the same variable.
        - kind: SendActivity
          id: sendComparisonV5
          activity: |-
            {Topic.LedgerRowV5.RowId} | {Topic.LedgerRowV5.Ref} | {Topic.MatchStatusV5}
            Internal: USD {Topic.LedgerAmountV5} | {Topic.LedgerRowV5.ValueDate}
            Bank: {Topic.BankDetailsV5}
    - kind: SendActivity
      id: bankOnlyHeadingV5
      activity: BANK-ONLY ENTRIES
    # SECOND PASS: show every bank entry whose reference is absent internally.
    - kind: Foreach
      id: scanBankOnlyV5
      items: =Topic.BankStatement
      value: init:Topic.BankRowV5
      index: init:Topic.BankIndexV5
      actions:
        - kind: ConditionGroup
          id: bankOnlyBranchV5
          conditions:
            - id: noInternalReferenceV5
              condition: =CountRows(Filter(Topic.InternalLedger, Ref = Topic.BankRowV5.Ref)) = 0
              actions:
                - kind: SetVariable
                  id: formatBankOnlyAmountV5
                  variable: init:Topic.BankOnlyAmountV5
                  value: =Text(Topic.BankRowV5.Cents / 100)
                - kind: SendActivity
                  id: sendBankOnlyV5
                  activity: '{Topic.BankRowV5.RowId} | {Topic.BankRowV5.Ref} | USD {Topic.BankOnlyAmountV5} | {Topic.BankRowV5.ValueDate}'
    # LIMITS: findings are for human investigation; there is no writeback.
    - kind: SendActivity
      id: reviewNotesV5
      activity: |-
        REVIEW REQUIRED
        Investigate amount differences; the USD 25 cause is unverified.
        Confirm settlement evidence for value-date differences.
        Investigate repeated bank entries before choosing any match.
        Investigate internal-only and bank-only entries.
        No opening balance was supplied; no closing balance was calculated.
        No adjustments or payments were executed.
inputType: {}
outputType: {}
